# Publish site/ to GitHub Pages (https://openvms.issinoho.com), with a fresh
# snapshot of every port's latest release. It runs on changes to the site, every
# six hours, by hand, and on a "release-published" repository_dispatch, which a
# sibling repo can send when it publishes a release.
name: Pages

on:
  push:
    branches: [master]
    paths: ['site/**', 'tools/site-releases.sh', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/site-releases.sh site/releases.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
